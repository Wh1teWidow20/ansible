---
# VMware vCenter dynamisches Inventory Plugin (aktualisiert auf vmware.vmware.vms)
plugin: vmware.vmware.vms

# vCenter Server Verbindungsdetails
vcenter_hostname: LTERZTA001.dptrzm.de
vcenter_username: "{{ lookup('env', 'VCENTER_USERNAME') }}"
vcenter_password: "{{ lookup('env', 'VCENTER_PASSWORD') }}"
vcenter_port: 443
vcenter_validate_certs: no

# Nur VMs mit Namen die mit "LTERZTA" beginnen
filters:
  - guest.guestFamily == "linuxGuest"
  - name is match("LTERZTA.*")

# Properties die abgerufen werden sollen
properties:
  - name
  - guest.ipAddress
  - guest.guestFamily
  - guest.guestFullName
  - config.guestId
  - runtime.powerState

# Nur eingeschaltete VMs
with_tags: no

# Hostname-Konfiguration
hostnames:
  - 'guest.ipAddress'
  - 'name'

# Gruppierung nach Betriebssystem
keyed_groups:
  # RHEL-basierte Systeme (RHEL, CentOS, Rocky, AlmaLinux)
  - key: guest.guestId
    separator: ''
    prefix: ''
  - key: guest.guestId | regex_replace('^(rhel|centos|rocky|alma).*', 'rhel_based')
    separator: ''
  # SLES-basierte Systeme
  - key: guest.guestId | regex_replace('^(sles|suse).*', 'suse_based')
    separator: ''
  # Debian-basierte Systeme (Ubuntu, Debian)
  - key: guest.guestId | regex_replace('^(ubuntu|debian).*', 'debian_based')
    separator: ''

# Compose Variablen
compose:
  ansible_host: guest.ipAddress
  vm_name: name
  vm_guest_os: guest.guestFullName
  vm_power_state: runtime.powerState

# Strict Mode
strict: False
