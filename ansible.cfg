[defaults]
# Inventory-Konfiguration
# Verwendet sowohl statisches Inventory (hosts) als auch dynamisches VMware Inventory (vmware.yml)
inventory = ./inventory/

# Inventory Plugin aktivieren
enable_plugins = host_list, script, auto, yaml, ini, toml, community.vmware.vmware_vm_inventory

# SSH-Einstellungen
host_key_checking = False
timeout = 30

# Passwort-Authentifizierung (AD-User)
# Verwenden Sie: ansible-playbook playbook.yml --ask-pass --ask-become-pass
# Oder setzen Sie ANSIBLE_PASSWORD und ANSIBLE_BECOME_PASSWORD in ad_credentials.sh
# ask_pass = False
# ask_become_pass = False

# Retry-Einstellungen
retry_files_enabled = False

# Logging
log_path = ./ansible.log

# Parallelität
forks = 10

# Privilege Escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Cache für Inventory (beschleunigt wiederholte Aufrufe)
fact_caching = jsonfile
fact_caching_connection = ./.ansible_cache
fact_caching_timeout = 3600

[inventory]
# Inventory Plugin Cache
cache = yes
cache_plugin = jsonfile
cache_timeout = 3600
cache_connection = ./.ansible_cache

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
